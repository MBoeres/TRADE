name: Daily trade news
on:
  schedule:
    - cron: "0 11 * * *"   # 7 Uhr Washington im Sommer (EDT)
    - cron: "0 12 * * *"   # 7 Uhr Washington im Winter (EST)
  workflow_dispatch: {}     # manueller Test über den Actions-Tab

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python news_agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
